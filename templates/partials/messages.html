{% if messages %}
<div class="toast-container position-fixed top-0 end-0 p-3 custom-toast-container" style="z-index: 9999;">
    {% for msg in messages %}
        <div class="alert alert-{{ msg.tags|default:'info' }} fade show shadow-lg border-0 custom-toast-alert toast-msg-{% if 'success' in msg.tags %}success{% elif 'info' in msg.tags %}info{% elif 'error' in msg.tags or 'danger' in msg.tags %}error{% elif 'warning' in msg.tags %}warning{% else %}default{% endif %}"
             role="alert" 
             style="position: relative; padding-right: 45px;">
            <i class="fas {% if 'success' in msg.tags %}fa-check-circle text-success{% elif 'info' in msg.tags %}fa-info-circle text-info{% elif 'error' in msg.tags or 'danger' in msg.tags %}fa-exclamation-circle text-danger{% elif 'warning' in msg.tags %}fa-exclamation-triangle text-warning{% else %}fa-info-circle text-info{% endif %} me-2 fs-5 custom-toast-icon"></i>
            {{ msg }}
            
            <button type="button" 
                    class="custom-toast-close"
                    onclick="cerrarMensajeGlobal(this)"
                    aria-label="Cerrar">
                <i class="fas fa-times" style="pointer-events: none;"></i>
            </button>
        </div>
    {% endfor %}
</div>
{% endif %}

<script>
function cerrarMensajeGlobal(button) {
    var toast = button && button.closest('.custom-toast-alert');
    if (!toast) return;
    toast.classList.remove('show');
    window.setTimeout(function() {
        if (toast.isConnected) toast.remove();
    }, 180);
}

(function() {
    function activarMensajesGlobales() {
        document.querySelectorAll('.custom-toast-alert:not([data-dismiss-ready])').forEach(function(toast) {
            toast.setAttribute('data-dismiss-ready', 'true');
            var esError = toast.classList.contains('toast-msg-error') || toast.classList.contains('toast-msg-warning');
            window.setTimeout(function() {
                if (!toast.isConnected) return;
                toast.classList.remove('show');
                window.setTimeout(function() {
                    if (toast.isConnected) toast.remove();
                }, 220);
            }, esError ? 8000 : 5000);
        });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', activarMensajesGlobales, { once: true });
    } else {
        activarMensajesGlobales();
    }
})();
</script>
