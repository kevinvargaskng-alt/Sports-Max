<!-- ═══════════════════════════════════════════════════════════════
     MENÚ PRINCIPAL DE ADMINISTRACIÓN Y MÓDULOS DEPORTIVOS
     Agrupación lógica: Administración vs. Módulos Deportivos
     ═══════════════════════════════════════════════════════════════ -->
<style>
.smax-admin-nav {
    background: rgba(15, 23, 42, 0.72);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 14px;
    padding: 12px 16px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    backdrop-filter: blur(8px);
}
.smax-admin-nav-group {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
}
.smax-admin-nav-label {
    font-size: 0.7rem;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.55);
    padding-right: 6px;
    border-right: 1px solid rgba(255, 255, 255, 0.15);
    margin-right: 2px;
}
.smax-admin-nav-link {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 0.82rem;
    font-weight: 600;
    text-decoration: none;
    color: rgba(255, 255, 255, 0.86);
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.12);
    transition: all 0.2s ease;
    white-space: nowrap;
}
.smax-admin-nav-link:hover {
    color: #ffffff;
    background: rgba(57, 169, 0, 0.22);
    border-color: #39A900;
    transform: translateY(-1px);
}
.smax-admin-nav-link.active {
    background: linear-gradient(135deg, #39A900, #007832);
    border-color: #39A900;
    color: #ffffff;
    box-shadow: 0 4px 12px rgba(57, 169, 0, 0.3);
}
.smax-admin-nav-link.accent-orange.active {
    background: linear-gradient(135deg, #FF6B00, #ea580c);
    border-color: #FF6B00;
    box-shadow: 0 4px 12px rgba(255, 107, 0, 0.3);
}
/* Modo claro SENA */
html.acc-claro .smax-admin-nav,
body.light-theme .smax-admin-nav {
    background: #FFFFFF;
    border: 1.5px solid #E2E8F0;
    box-shadow: 0 6px 20px rgba(30, 41, 59, 0.06);
}
html.acc-claro .smax-admin-nav-label,
body.light-theme .smax-admin-nav-label {
    color: #007832;
    border-right-color: #CBD5E1;
}
html.acc-claro .smax-admin-nav-link,
body.light-theme .smax-admin-nav-link {
    color: #1E293B;
    background: #F8FAFC;
    border-color: #CBD5E1;
}
html.acc-claro .smax-admin-nav-link:hover,
body.light-theme .smax-admin-nav-link:hover {
    background: rgba(57, 169, 0, 0.1);
    border-color: #39A900;
    color: #007832;
}
html.acc-claro .smax-admin-nav-link.active,
body.light-theme .smax-admin-nav-link.active {
    background: linear-gradient(135deg, #39A900, #007832);
    border-color: #007832;
    color: #FFFFFF;
}
html.acc-claro .smax-admin-nav-link.accent-orange.active,
body.light-theme .smax-admin-nav-link.accent-orange.active {
    background: linear-gradient(135deg, #FF6B00, #ea580c);
    border-color: #FF6B00;
    color: #FFFFFF;
}
@media (max-width: 767.98px) {
    .smax-admin-nav { padding: 10px 12px; gap: 10px; }
    .smax-admin-nav-label { width: 100%; border-right: none; border-bottom: 1px solid rgba(148, 163, 184, 0.25); padding-bottom: 4px; margin-bottom: 2px; }
    .smax-admin-nav-link { padding: 6px 11px; font-size: 0.78rem; }
}
</style>

{% with url_name=request.resolver_match.url_name tab=admin_tab|default:'' %}
<nav class="smax-admin-nav mb-4" aria-label="Menú principal de administración">
    <!-- Grupo 1: Administración del Sistema -->
    <div class="smax-admin-nav-group" role="group" aria-label="Administración y sistema">
        <span class="smax-admin-nav-label"><i class="fas fa-shield-alt me-1"></i>Administración</span>

        <a href="{% url 'perfil' %}"
           class="smax-admin-nav-link {% if tab == 'perfil' or url_name == 'perfil' %}active{% endif %}"
           {% if tab == 'perfil' or url_name == 'perfil' %}aria-current="page"{% endif %}>
            <i class="fas fa-id-badge"></i> Mi Perfil
        </a>

        <a href="{% url 'gestionar_usuarios' %}"
           class="smax-admin-nav-link {% if tab == 'usuarios' or url_name == 'gestionar_usuarios' %}active{% endif %}"
           {% if tab == 'usuarios' or url_name == 'gestionar_usuarios' %}aria-current="page"{% endif %}>
            <i class="fas fa-users-cog"></i> Usuarios
        </a>

        <a href="{% url 'gestionar_backups' %}"
           class="smax-admin-nav-link accent-orange {% if tab == 'backups' or url_name == 'gestionar_backups' %}active{% endif %}"
           {% if tab == 'backups' or url_name == 'gestionar_backups' %}aria-current="page"{% endif %}>
            <i class="fas fa-database"></i> Copias de Seguridad
        </a>
    </div>

    <!-- Grupo 2: Módulos Deportivos -->
    <div class="smax-admin-nav-group" role="group" aria-label="Módulos deportivos">
        <span class="smax-admin-nav-label"><i class="fas fa-running me-1"></i>Módulos</span>

        <a href="{% url 'gimnasio' %}"
           class="smax-admin-nav-link {% if tab == 'gimnasio' or url_name == 'gimnasio' %}active{% endif %}"
           {% if tab == 'gimnasio' or url_name == 'gimnasio' %}aria-current="page"{% endif %}>
            <i class="fas fa-dumbbell"></i> Gimnasio
        </a>

        <a href="{% url 'interfichas' %}"
           class="smax-admin-nav-link {% if tab == 'torneos' or url_name == 'interfichas' %}active{% endif %}"
           {% if tab == 'torneos' or url_name == 'interfichas' %}aria-current="page"{% endif %}>
            <i class="fas fa-trophy"></i> Torneos
        </a>

        <a href="{% url 'inventario' %}"
           class="smax-admin-nav-link {% if tab == 'inventario' or url_name == 'inventario' %}active{% endif %}"
           {% if tab == 'inventario' or url_name == 'inventario' %}aria-current="page"{% endif %}>
            <i class="fas fa-box"></i> Inventario
        </a>

        <a href="{% url 'habitos:inicio' %}"
           class="smax-admin-nav-link {% if tab == 'habitos' or request.resolver_match.namespace == 'habitos' %}active{% endif %}"
           {% if tab == 'habitos' or request.resolver_match.namespace == 'habitos' %}aria-current="page"{% endif %}>
            <i class="fas fa-heartbeat"></i> Hábitos
        </a>
    </div>
</nav>
{% endwith %}
